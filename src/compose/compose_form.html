<form id="compose-form" method="POST" action="/compose/">
    <h2 style="color:#D89B94;">Compose Email</h2>
    <label><b>To (one per line, format: email,name):</b><br>
        <textarea name="recipients" rows="3" style="width:100%;" required placeholder="example@email.com,John Doe"></textarea>
    </label><br><br>
    <label><b>Subject:</b><br>
        <input type="text" name="subject" style="width:100%;" required>
    </label><br><br>
    <label><b>Message:</b><br>
        <textarea name="message" rows="10" style="width:100%;" required></textarea>
    </label><br><br>
    <button type="submit" class="compose-btn">Send</button>
</form>
<script>
document.getElementById('compose-form').onsubmit = function() {
    // Optionally, add AJAX submit logic here for a smoother UX
    document.querySelector('.compose-btn').disabled = true;
};
</script>
