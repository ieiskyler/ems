<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Blaster Web App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f6f6f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #fff;
            width: 90%;
            max-width: 600px;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 22px;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        label {
            font-size: 14px;
            font-weight: bold;
            color: #555;
            display: block;
            margin-top: 10px;
        }
        textarea, input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }
        button {
            background-color: #4285F4;
            color: white;
            padding: 12px 18px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #357AE8;
        }
        .back-btn {
            display: inline-block;
            background: #eee;
            color: #D89B94;
            border: none;
            border-radius: 20px;
            padding: 8px 22px;
            font-size: 1em;
            font-weight: bold;
            margin-bottom: 24px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .back-btn:hover {
            background: #f7eaea;
        }
        .flash {
            padding: 12px 18px;
            border-radius: 6px;
            margin-bottom: 18px;
            font-size: 15px;
            font-weight: bold;
        }
        .flash-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #b2dfbb;
        }
        .flash-danger {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .tags-input {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            min-height: 48px;
            border: 1.5px solid #ccc;
            border-radius: 6px;
            padding: 6px 8px;
            background: #fff;
            cursor: text;
        }
        .tags-input input {
            border: none;
            outline: none;
            font-size: 14px;
            flex: 1;
            min-width: 120px;
            margin: 2px 0;
        }
        .tag {
            display: flex;
            align-items: center;
            background: #f1fff1;
            color: #333;
            border-radius: 20px;
            padding: 5px 12px;
            margin: 2px 4px 2px 0;
            font-weight: bold;
            border: 2px solid #4CAF50;
            font-size: 13px;
        }
        .tag.invalid {
            background: #fff1f1;
            border: 2px solid #d32f2f;
            color: #d32f2f;
        }
        .tag.selected {
            background: #D89B94 !important;
            color: #fff !important;
            border-color: #D89B94 !important;
        }
        .tag .remove-tag {
            margin-left: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        #recipients-feedback {
            margin-top: 5px;
            font-size: 13px;
            font-weight: bold;
        }
        .valid-email {
            border: 2px solid #4CAF50 !important;
            background: #f1fff1;
            font-weight: bold;
        }
        .invalid-email {
            border: 2px solid #d32f2f !important;
            background: #fff1f1;
            font-weight: bold;
        }
        ul { padding: 0; list-style-type: none; }
        li { font-size: 14px; padding: 8px; border-radius: 5px; margin: 5px 0; }
        #progress-container { display:none; margin-top:30px; }
        #progress-bar {
            background: linear-gradient(90deg, #D89B94 0%, #F7CAC9 100%);
            width:0%; height:32px; color:white; text-align:center; line-height:32px;
            font-weight:bold; font-size:16px; border-radius:30px 0 0 30px;
            transition: width 0.4s cubic-bezier(.4,2.2,.2,1);
            box-shadow: 0 2px 8px rgba(216,155,148,0.15);
        }
        #progress-status {
            margin-top:14px;
            font-size:16px;
            color:#D89B94;
            text-align:center;
            font-weight:500;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="back-btn" onclick="window.location.href='{{ url_for('dashboard.dashboard') }}'">&larr; Back to Dashboard</button>
        <h1>Compose</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div>
              {% for category, message in messages %}
                <div class="flash flash-{{ category }}">{{ message }}</div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form method="post">
            <label>Recipients (format: email,name):</label>
            <div id="recipients-tags" class="tags-input" tabindex="0">
                <input type="text" id="recipients-input" placeholder="Type email,name and press Enter or comma" autocomplete="off">
            </div>
            <div id="recipients-feedback"></div>
            <input type="hidden" name="recipients" id="recipients-hidden">

            <label>Subject:</label>
            <input type="text" name="subject">

            <label>Message (HTML allowed, use {name} for personalization):</label>
            <textarea name="message" rows="10"></textarea>

            <button type="submit">Send Emails</button>
        </form>

        <div style="margin: 10px 0;">
            <button type="button" id="remove-selected" style="background:#d32f2f;color:#fff;margin-right:10px;">Remove Selected</button>
            <button type="button" id="remove-all" style="background:#888;color:#fff;">Remove All</button>
        </div>

        <div id="progress-container">
            <div>
                <div id="progress-bar">0%</div>
            </div>
            <div id="progress-status"></div>
        </div>
    </div>

    <script>
    function validateEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    const tagsContainer = document.getElementById('recipients-tags');
    const tagsInput = document.getElementById('recipients-input');
    const tagsHidden = document.getElementById('recipients-hidden');
    const feedback = document.getElementById('recipients-feedback');
    let tags = [];
    let selectedTagIndexes = [];

    function addTag(value) {
        value = value.trim().replace(/,$/, '');
        if (value) {
            const parts = value.split(',');
            const valid = parts.length === 2 && validateEmail(parts[0].trim());
            tags.push({text: value, valid});
        }
    }

    function renderTags() {
        tagsContainer.querySelectorAll('.tag').forEach(tag => tag.remove());
        let allValid = true;
        tags.forEach((tag, idx) => {
            const tagElem = document.createElement('span');
            tagElem.className = 'tag' + (tag.valid ? '' : ' invalid') + (selectedTagIndexes.includes(idx) ? ' selected' : '');
            tagElem.setAttribute('data-idx', idx);
            tagElem.innerHTML =
                (tag.valid ? '✔️ ' : '❌ ') + tag.text +
                `<span class="remove-tag" data-idx="${idx}" style="margin-left:8px;">&times;</span>`;
            tagsContainer.insertBefore(tagElem, tagsInput);
            if (!tag.valid) allValid = false;
        });
        tagsHidden.value = tags.map(t => t.text).join('\n');
        feedback.innerHTML = allValid || tags.length === 0
            ? ''
            : '<span style="color:#d32f2f;">Some recipients are invalid. Please fix or remove them.</span>';
    }

    tagsContainer.addEventListener('click', function(e) {
        if (e.target.classList.contains('remove-tag')) {
            const idx = Number(e.target.dataset.idx);
            tags.splice(idx, 1);
            selectedTagIndexes = selectedTagIndexes.filter(i => i !== idx).map(i => i > idx ? i - 1 : i);
            renderTags();
            return;
        }
        if (e.target.classList.contains('tag')) {
            const idx = Number(e.target.getAttribute('data-idx'));
            if (e.ctrlKey || e.metaKey) {
                if (selectedTagIndexes.includes(idx)) {
                    selectedTagIndexes = selectedTagIndexes.filter(i => i !== idx);
                } else {
                    selectedTagIndexes.push(idx);
                }
            } else if (e.shiftKey && selectedTagIndexes.length > 0) {
                const last = selectedTagIndexes[selectedTagIndexes.length - 1];
                const [start, end] = [Math.min(last, idx), Math.max(last, idx)];
                selectedTagIndexes = [];
                for (let i = start; i <= end; i++) selectedTagIndexes.push(i);
            } else {
                selectedTagIndexes = [idx];
            }
            renderTags();
        } else {
            tagsInput.focus();
        }
    });

    tagsInput.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a') {
            e.preventDefault();
            selectedTagIndexes = tags.map((_, idx) => idx);
            renderTags();
        } else if ((e.key === 'Delete' || e.key === 'Backspace') && selectedTagIndexes.length > 0 && tagsInput.value === '') {
            selectedTagIndexes.sort((a, b) => b - a).forEach(idx => tags.splice(idx, 1));
            selectedTagIndexes = [];
            renderTags();
        } else if (e.key === 'Enter' || e.key === 'Tab') {
            e.preventDefault();
            let value = tagsInput.value.trim();
            if (value.includes('\n')) {
                value.split('\n').forEach(line => addTag(line));
            } else {
                addTag(value);
            }
            tagsInput.value = '';
            renderTags();
        } else if (e.key === 'Backspace' && tagsInput.value === '' && tags.length > 0 && selectedTagIndexes.length === 0) {
            tags.pop();
            renderTags();
        }
    });

    tagsInput.addEventListener('paste', function(e) {
        e.preventDefault();
        let paste = (e.clipboardData || window.clipboardData).getData('text');
        paste.split('\n').forEach(line => addTag(line));
        tagsInput.value = '';
        renderTags();
    });

    document.getElementById('remove-selected').addEventListener('click', function() {
        selectedTagIndexes.sort((a, b) => b - a).forEach(idx => tags.splice(idx, 1));
        selectedTagIndexes = [];
        renderTags();
    });

    document.getElementById('remove-all').addEventListener('click', function() {
        tags = [];
        selectedTagIndexes = [];
        renderTags();
    });
    </script>
</body>
</html>
